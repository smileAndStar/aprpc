<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">APRPC 整体框架与 Login 完整调用链</title>
  <desc id="diagram-desc">展示 Consumer、ZooKeeper、Provider 之间的服务注册、服务发现、请求序列化、TCP 传输、服务端分发、业务处理和响应返回过程，并按调用方业务代码、Protobuf 提供或生成代码、APRPC 框架实现三种归属着色。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976d2"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef6c00"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b1fa2"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; }
      .main-title { font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 20px; fill: #526079; }
      .lane-title { font-size: 25px; font-weight: 700; }
      .box-title { font-size: 21px; font-weight: 700; }
      .box-text { font-size: 19px; fill: #334155; }
      .edge-text { font-size: 18px; font-weight: 600; }
      .note { font-size: 18px; fill: #64748b; }
      .client-title { fill: #0d47a1; }
      .client-text { fill: #123f6d; }
      .server-title { fill: #1b5e20; }
      .server-text { fill: #294c2d; }
      .zk-title { fill: #e65100; }
      .zk-text { fill: #7c3f13; }
      .core-title { fill: #4a148c; }
      .app-box { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.2; rx: 14; }
      .rpc-box { fill: #fbf8ff; stroke: #9a5ab5; stroke-width: 2.2; rx: 14; }
      .app-title { fill: #1d4ed8; }
      .app-text { fill: #1e3a5f; }
      .rpc-title { fill: #6d28d9; }
      .rpc-text { fill: #4c1d95; }
      .client-box { fill: #ffffff; stroke: #64a7e8; stroke-width: 2; rx: 14; }
      .server-box { fill: #ffffff; stroke: #68ad6c; stroke-width: 2; rx: 14; }
      .zk-box { fill: #fffdfa; stroke: #ed9b51; stroke-width: 2; rx: 14; }
      .core-box { fill: #fcf7ff; stroke: #9a5ab5; stroke-width: 2.5; rx: 14; }
      .pb-box { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; rx: 14; }
      .pb-title { fill: #334155; }
      .client-flow { fill: none; stroke: #1976d2; stroke-width: 3; marker-end: url(#arrow-blue); }
      .startup-flow { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow-slate); }
      .server-flow { fill: none; stroke: #388e3c; stroke-width: 3; marker-end: url(#arrow-green); }
      .request-flow { fill: none; stroke: #1976d2; stroke-width: 4; marker-end: url(#arrow-blue); }
      .response-flow { fill: none; stroke: #7b1fa2; stroke-width: 4; marker-end: url(#arrow-purple); }
      .zk-flow { fill: none; stroke: #ef6c00; stroke-width: 2.5; stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1800" height="1360" fill="#f8fafc"/>
  <text x="900" y="54" text-anchor="middle" class="main-title">APRPC 整体框架与 Login 完整调用链</text>
  <text x="900" y="88" text-anchor="middle" class="subtitle">同步短连接客户端 + 异步服务端｜Protobuf 编解码｜ZooKeeper 服务发现｜Boost.Asio TCP 通信</text>

  <rect x="35" y="120" width="440" height="1170" rx="22" fill="#eef6ff" stroke="#90caf9" stroke-width="2"/>
  <rect x="515" y="120" width="300" height="540" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <rect x="855" y="120" width="910" height="1170" rx="22" fill="#f0f9f1" stroke="#81c784" stroke-width="2"/>

  <text x="255" y="160" text-anchor="middle" class="lane-title client-title">Consumer 客户端（同步）</text>
  <text x="665" y="160" text-anchor="middle" class="lane-title zk-title">ZooKeeper</text>
  <text x="1310" y="160" text-anchor="middle" class="lane-title server-title">Provider 服务端（异步 I/O）</text>

  <!-- Client nodes -->
  <rect x="70" y="185" width="370" height="88" class="app-box"/>
  <text x="255" y="218" text-anchor="middle" class="box-title client-title">[1] Consumer main</text>
  <text x="255" y="248" text-anchor="middle" class="box-text app-text">new RpcChannel() + stub.Login(...)</text>

  <rect x="70" y="305" width="370" height="108" class="pb-box"/>
  <text x="255" y="338" text-anchor="middle" class="box-title pb-title">Protobuf 生成的 Stub</text>
  <text x="255" y="368" text-anchor="middle" class="box-text">UserServiceRPC_Stub::Login</text>
  <text x="255" y="395" text-anchor="middle" class="box-text">channel_->CallMethod(method, ...)</text>
  <path d="M255 413 V437" class="client-flow"/>

  <rect x="70" y="445" width="370" height="108" class="rpc-box"/>
  <text x="255" y="478" text-anchor="middle" class="box-title rpc-title">[2] RpcChannel::CallMethod</text>
  <text x="255" y="508" text-anchor="middle" class="box-text">APRPC 实现 · 客户端传输入口</text>
  <text x="255" y="538" text-anchor="middle" class="box-text">基类 google::protobuf::RpcChannel</text>

  <rect x="70" y="585" width="370" height="108" class="rpc-box"/>
  <text x="255" y="598" text-anchor="middle" class="box-title rpc-title">[3] 序列化与请求组帧</text>
  <text x="255" y="628" text-anchor="middle" class="box-text rpc-text">LoginRequest + RpcHeader</text>
  <text x="255" y="655" text-anchor="middle" class="box-text rpc-text">4B header_size + Header + Args</text>

  <rect x="70" y="705" width="370" height="88" class="rpc-box"/>
  <text x="255" y="738" text-anchor="middle" class="box-title rpc-title">[4] ZooKeeper 服务发现</text>
  <text x="255" y="768" text-anchor="middle" class="box-text rpc-text">ZkClient::Start / GetData</text>

  <rect x="70" y="825" width="370" height="88" class="rpc-box"/>
  <text x="255" y="858" text-anchor="middle" class="box-title rpc-title">[5] 同步 TCP 发送</text>
  <text x="255" y="888" text-anchor="middle" class="box-text rpc-text">connect + write</text>

  <rect x="70" y="1055" width="370" height="108" class="rpc-box"/>
  <text x="255" y="1088" text-anchor="middle" class="box-title rpc-title">[10] 同步接收并解析响应</text>
  <text x="255" y="1118" text-anchor="middle" class="box-text rpc-text">read response_len + body</text>
  <text x="255" y="1145" text-anchor="middle" class="box-text rpc-text">LoginResponse.ParseFromString</text>

  <rect x="70" y="1195" width="370" height="60" class="app-box"/>
  <text x="255" y="1233" text-anchor="middle" class="box-title client-title">返回 main，使用 LoginResponse</text>

  <path d="M255 273 V297" class="client-flow"/>
  <path d="M255 553 V577" class="client-flow"/>
  <path d="M255 673 V697" class="client-flow"/>
  <path d="M255 793 V817" class="client-flow"/>
  <path d="M255 1163 V1187" class="client-flow"/>

  <!-- ZooKeeper nodes -->
  <rect x="545" y="200" width="240" height="92" class="zk-box"/>
  <text x="665" y="235" text-anchor="middle" class="box-title zk-title">/UserServiceRPC</text>
  <text x="665" y="266" text-anchor="middle" class="box-text zk-text">服务永久节点</text>

  <rect x="545" y="330" width="240" height="120" class="zk-box"/>
  <text x="665" y="365" text-anchor="middle" class="box-title zk-title">/Login</text>
  <text x="665" y="396" text-anchor="middle" class="box-text zk-text">方法临时节点</text>
  <text x="665" y="426" text-anchor="middle" class="box-text zk-text">127.0.0.1:8000</text>

  <text x="665" y="500" text-anchor="middle" class="note">仅保存服务地址</text>
  <text x="665" y="528" text-anchor="middle" class="note">不传输 RPC 请求和响应</text>
  <text x="665" y="580" text-anchor="middle" class="note">Provider 启动时注册 ip:port</text>
  <text x="665" y="608" text-anchor="middle" class="note">Consumer 调用前查询地址</text>

  <path d="M440 735 C500 735 505 405 537 405" class="zk-flow" marker-end="url(#arrow-orange)"/>
  <path d="M545 425 C505 425 500 765 448 765" class="zk-flow" marker-end="url(#arrow-orange)"/>
  <rect x="475" y="475" width="80" height="66" rx="10" fill="#fff7ed"/>
  <text x="515" y="501" text-anchor="middle" class="edge-text zk-title">查询路径</text>
  <text x="515" y="528" text-anchor="middle" class="edge-text zk-title">返回地址</text>

  <!-- Provider startup and request nodes -->
  <rect x="895" y="185" width="830" height="82" class="app-box"/>
  <text x="1310" y="218" text-anchor="middle" class="box-title app-title">Provider main：启动阶段</text>
  <text x="1310" y="248" text-anchor="middle" class="box-text app-text">RpcApplication::Init → NotifyService(new UserService) → Run</text>

  <rect x="895" y="297" width="830" height="88" class="rpc-box"/>
  <text x="1310" y="330" text-anchor="middle" class="box-title rpc-title">NotifyService：建立内存注册表 serviceMap_</text>
  <text x="1310" y="361" text-anchor="middle" class="box-text rpc-text">UserServiceRPC → UserService；Login → MethodDescriptor</text>

  <rect x="895" y="415" width="830" height="88" class="rpc-box"/>
  <text x="1310" y="448" text-anchor="middle" class="box-title rpc-title">Run：启动网络服务</text>
  <text x="1310" y="479" text-anchor="middle" class="box-text rpc-text">TCP 监听 + ZooKeeper 注册 + 8 个 io_context 工作线程</text>

  <rect x="895" y="535" width="830" height="100" class="rpc-box"/>
  <text x="1310" y="568" text-anchor="middle" class="box-title rpc-title">[6] 接收连接、异步读取与拆包</text>
  <text x="1310" y="598" text-anchor="middle" class="box-text rpc-text">async_accept → Session::DoRead → TryParseAndHandle</text>
  <text x="1310" y="624" text-anchor="middle" class="box-text rpc-text">累积 recv_buffer_，处理 TCP 半包与粘包</text>

  <rect x="895" y="667" width="830" height="100" class="rpc-box"/>
  <text x="1310" y="700" text-anchor="middle" class="box-title core-title">[7] RpcProvider::HandleRequest</text>
  <text x="1310" y="730" text-anchor="middle" class="box-text">查询 serviceMap_，创建并反序列化 LoginRequest</text>
  <text x="1310" y="756" text-anchor="middle" class="box-text">创建 LoginResponse 和 done 回调</text>

  <rect x="895" y="799" width="830" height="88" class="pb-box"/>
  <text x="1310" y="832" text-anchor="middle" class="box-title pb-title">Protobuf 生成 · Service::CallMethod</text>
  <text x="1310" y="862" text-anchor="middle" class="box-text">UserServiceRPC::CallMethod · 按 method->index() 分发</text>

  <rect x="895" y="919" width="830" height="100" class="app-box"/>
  <text x="1310" y="952" text-anchor="middle" class="box-title app-title">[8] UserService::Login</text>
  <text x="1310" y="982" text-anchor="middle" class="box-text app-text">调用方业务实现：读取请求 → 执行 Login → 填写响应</text>
  <text x="1310" y="1008" text-anchor="middle" class="box-text app-text">完成后调用 done->Run()</text>

  <rect x="895" y="1051" width="830" height="100" class="rpc-box"/>
  <text x="1310" y="1084" text-anchor="middle" class="box-title rpc-title">[9] SendRpcResponse · 异步写回</text>
  <text x="1310" y="1114" text-anchor="middle" class="box-text rpc-text">SendRpcResponse → Session::DoWrite</text>
  <text x="1310" y="1140" text-anchor="middle" class="box-text rpc-text">4B response_len + LoginResponse；发送后关闭连接</text>

  <path d="M1310 267 V289" class="startup-flow"/>
  <path d="M1310 385 V407" class="startup-flow"/>
  <path d="M1310 503 V527" class="startup-flow"/>
  <path d="M1310 635 V659" class="server-flow"/>
  <path d="M1310 767 V791" class="server-flow"/>
  <path d="M1310 887 V911" class="server-flow"/>
  <path d="M1310 1019 V1043" class="server-flow"/>

  <!-- Cross-lane registration, request and response -->
  <path d="M895 459 C855 459 835 390 793 390" class="zk-flow" marker-end="url(#arrow-orange)"/>

  <path d="M440 869 H825 V585 H887" class="request-flow"/>
  <rect x="500" y="814" width="300" height="38" rx="10" fill="#eef6ff"/>
  <text x="650" y="840" text-anchor="middle" class="edge-text client-title">RPC 请求：Header + LoginRequest</text>

  <path d="M895 1109 H448" class="response-flow"/>
  <rect x="500" y="1035" width="310" height="38" rx="10" fill="#fcf7ff"/>
  <text x="655" y="1061" text-anchor="middle" class="edge-text core-title">RPC 响应：LoginResponse</text>

  <!-- Legend -->
  <g aria-label="图例">
    <path d="M60 1320 H108" class="client-flow"/>
    <text x="122" y="1327" class="note">Login 调用链</text>
    <path d="M282 1320 H330" class="zk-flow" marker-end="url(#arrow-orange)"/>
    <text x="344" y="1327" class="note">注册 / 发现</text>
    <path d="M500 1320 H548" class="startup-flow"/>
    <text x="562" y="1327" class="note">启动流程</text>
    <rect x="710" y="1304" width="40" height="26" class="app-box"/>
    <text x="764" y="1327" class="note">调用方业务代码</text>
    <rect x="980" y="1304" width="40" height="26" class="pb-box"/>
    <text x="1034" y="1327" class="note">Protobuf 提供 / 生成</text>
    <rect x="1320" y="1304" width="40" height="26" class="rpc-box"/>
    <text x="1374" y="1327" class="note">APRPC 框架实现</text>
  </g>
</svg>
